{% extends 'base.html' %}

{% block title %}Crear Cuenta | Restaurante Abaroa{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-panel">
        <div class="auth-form visible">
            <h3>Crear Cuenta</h3>

            {% if messages %}
                {% for message in messages %}
                    <div class="auth-mensaje {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form class="form-auth" method="post" action="{% url 'signup' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="reg-nombre">Nombre Completo</label>
                    <input type="text" id="reg-nombre" name="nombre" placeholder="Tu nombre completo" required>
                </div>

                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" name="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-telefono">Teléfono</label>
                    <input type="tel" id="reg-telefono" name="telefono" placeholder="+56 9 1234 5678">
                </div>

                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" name="password" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="reg-password2">Confirmar Contraseña</label>
                    <input type="password" id="reg-password2" name="password2" placeholder="Repite tu contraseña" required>
                </div>

                <button type="submit" class="btn-auth">Registrarse</button>
            </form>

            <p class="auth-toggle-text">
                ¿Ya tienes una cuenta?
                <a class="auth-link" href="{% url 'login' %}">Inicia Sesión</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
