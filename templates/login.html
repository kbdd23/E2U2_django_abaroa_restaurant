{% extends 'base.html' %}

{% block title %}Inicia Sesión | Restaurante Abaroa{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-panel">
        <div class="auth-form visible">
            <h3>Inicia Sesión</h3>

            {% if messages %}
                {% for message in messages %}
                    <div class="auth-mensaje {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form class="form-auth" method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" name="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" name="password" placeholder="Tu contraseña" required>
                </div>

                <button type="submit" class="btn-auth">Inicia Sesión</button>
            </form>

            <p class="auth-toggle-text">
                ¿No tienes cuenta?
                <a class="auth-link" href="{% url 'signup' %}">Regístrate Aquí</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
