{% extends 'base.html' %}

{% block title %}Mi cuenta | Restaurante Abaroa{% endblock %}

{% block content %}
<!-- Base del panel del cliente: barra vertical fija a la izquierda y el
     contenido de cada seccion a la derecha. El tab activo llega en el
     contexto desde pages.views.perfil_view. -->
<section class="panel-cliente">

    <aside class="panel-lateral">
        <p class="panel-eyebrow">Mi cuenta</p>
        <h2 class="panel-titulo">{{ user.first_name|default:user.username }}</h2>

        <nav class="panel-menu" aria-label="Secciones de la cuenta">
            <a class="panel-opcion {% if tab == 'inicio' %}activa{% endif %}"
               href="{% url 'perfil' %}?tab=inicio">Inicio</a>
            <a class="panel-opcion {% if tab == 'reservar' %}activa{% endif %}"
               href="{% url 'perfil' %}?tab=reservar">Reservar</a>
            <a class="panel-opcion {% if tab == 'historial' %}activa{% endif %}"
               href="{% url 'perfil' %}?tab=historial">Historial</a>
            <a class="panel-opcion {% if tab == 'perfil' %}activa{% endif %}"
               href="{% url 'perfil' %}?tab=perfil">Perfil</a>
        </nav>

        <a class="panel-salir" href="{% url 'logout' %}">Cerrar sesión</a>
    </aside>

    <div class="panel-contenido">
        {% block contenido_panel %}{% endblock %}
    </div>

</section>
{% endblock %}
